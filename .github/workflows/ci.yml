name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://onlinepay:onlinepay@localhost:5432/onlinepay?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-ci-session-secret-ci
      OTP_PEPPER: ci-otp-pepper-ci-otp-pepper-ci-otp-pepper
      NYMCARD_MODE: mock
      PAYMENT_GATEWAY: mock
      KYC_PROVIDER: mock
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onlinepay
          POSTGRES_PASSWORD: onlinepay
          POSTGRES_DB: onlinepay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onlinepay" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile=${{ hashFiles('pnpm-lock.yaml') != '' }}
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
