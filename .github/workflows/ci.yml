name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run the gitleaks CLI over the full history (the action fails on a repo's first push).
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets
        run: gitleaks git --redact -v --config .gitleaks.toml .

  build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://onlinepay:onlinepay@localhost:5432/onlinepay?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-ci-session-secret-ci
      OTP_PEPPER: ci-otp-pepper-ci-otp-pepper-ci-otp-pepper
      NYMCARD_MODE: mock
      NYMCARD_WEBHOOK_SECRET: ci-webhook-secret
      PAYMENT_GATEWAY: mock
      KYC_PROVIDER: mock
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onlinepay
          POSTGRES_PASSWORD: onlinepay
          POSTGRES_DB: onlinepay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onlinepay" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Enable `cache: pnpm` once pnpm-lock.yaml is committed.

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml

      - run: pnpm db:generate

      - name: Generate initial migration if missing
        run: |
          if [ ! -d packages/db/prisma/migrations ]; then
            mkdir -p packages/db/prisma/migrations/00000000000000_init
            cd packages/db
            pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script \
              > prisma/migrations/00000000000000_init/migration.sql
            printf '# Please do not edit this file manually\nprovider = "postgresql"\n' \
              > prisma/migrations/migration_lock.toml
          fi
      - name: Upload migrations
        uses: actions/upload-artifact@v4
        with:
          name: prisma-migrations
          path: packages/db/prisma/migrations

      - run: pnpm db:deploy
      - run: pnpm --filter @onlinepay/shared build && pnpm --filter @onlinepay/db build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check
