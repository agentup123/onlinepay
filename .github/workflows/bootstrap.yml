name: Bootstrap (lockfile, initial migration, formatting)

# One-off maintenance workflow: generates pnpm-lock.yaml and the initial Prisma migration,
# runs Prettier, and commits the result back to the branch. Safe to re-run; no-op when clean.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - name: Initial migration
        run: |
          if [ ! -d packages/db/prisma/migrations ]; then
            cd packages/db
            mkdir -p prisma/migrations/00000000000000_init
            pnpm exec prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script \
              > prisma/migrations/00000000000000_init/migration.sql
            printf '# Please do not edit this file manually\n# It should be added in your version-control system (e.g., Git)\nprovider = "postgresql"\n' \
              > prisma/migrations/migration_lock.toml
          fi
      - run: pnpm format
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "chore: add lockfile, initial database migration and Prettier formatting"
          git push
